name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build Release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Verify Network Metadata
      run: cmd /c tests\run.bat

    - name: Build Project
      run: |
        cmd /c build.bat

    - name: Package Release
      run: |
        mkdir release_pkg
        copy bin\anti_afk.dll release_pkg\
        copy anti_afk_config.txt release_pkg\
        copy README.md release_pkg\
        copy README_EN.md release_pkg\
        copy LICENSE release_pkg\
        copy deps\applepie_sdk\LICENSE release_pkg\APPLEPIE_SDK_LICENSE
        copy deps\applepie_sdk\README.md release_pkg\APPLEPIE_SDK_NOTICE.md
        copy deps\applepie_sdk\VERSION.json release_pkg\APPLEPIE_SDK_VERSION.json
        Compress-Archive -Path release_pkg\* -DestinationPath "EndfieldAntiKick_${{ github.ref_name }}.zip"

    - name: Publish to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        files: EndfieldAntiKick_${{ github.ref_name }}.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
